<!doctype html>
<html lang="en-au">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Jared Lynch" />
    <meta
      name="description"
      content="A basic calculator, following The Odin
      Project"
    />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/Calculator-Icon.svg" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <h1>The Odin Project - Calculator</h1>
    <h2>Jared Lynch</h2>
    <div class="calc-body">
      <div class="screen"><p></p></div>
      <div class="buttons">
        <div>
          <button id="clear-all">CE</button>
          <button id="clear">C</button>
          <button id="<-"><-</button>
          <button id="^">^</button>
        </div>
        <div>
          <button id="7">7</button>
          <button id="8">8</button>
          <button id="9">9</button>
          <button id="*">*</button>
        </div>
        <div>
          <button id="4">4</button>
          <button id="5">5</button>
          <button id="6">6</button>
          <button id="-">-</button>
        </div>
        <div>
          <button id="1">1</button>
          <button id="2">2</button>
          <button id="3">3</button>
          <button id="+">+</button>
        </div>
        <div>
          <button id="0">0</button>
          <button id=".">.</button>
          <button id="=">=</button>
          <button id="/">/</button>
        </div>
      </div>
    </div>
  </body>
</html>
