<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64">

  <!-- Body -->
  <rect x="10" y="4"
        width="44"
        height="56"
        rx="10"
        fill="#4F8EF7"
        stroke="#2E5DB3"
        stroke-width="2.5"/>

  <!-- Screen -->
  <rect x="16" y="10"
        width="32"
        height="12"
        rx="3"
        fill="#DFF7E3"
        stroke="#8BBF8E"
        stroke-width="1.5"/>

  <!-- Cute face -->
  <circle cx="25" cy="16" r="1.2" fill="#333"/>
  <circle cx="39" cy="16" r="1.2" fill="#333"/>
  <path d="M27 19 Q32 22 37 19"
        fill="none"
        stroke="#333"
        stroke-width="1.4"
        stroke-linecap="round"/>

  <!-- Buttons -->
  <g>
    <!-- Row 1 -->
    <circle cx="20" cy="30" r="3.2" fill="#FFF"/>
    <circle cx="32" cy="30" r="3.2" fill="#FFF"/>
    <circle cx="44" cy="30" r="3.2" fill="#FFD166"/>

    <!-- Row 2 -->
    <circle cx="20" cy="40" r="3.2" fill="#FFF"/>
    <circle cx="32" cy="40" r="3.2" fill="#FFF"/>
    <circle cx="44" cy="40" r="3.2" fill="#FF7F50"/>

    <!-- Row 3 -->
    <circle cx="20" cy="50" r="3.2" fill="#FFF"/>
    <circle cx="32" cy="50" r="3.2" fill="#FFF"/>
    <circle cx="44" cy="50" r="3.2" fill="#6DD47E"/>
  </g>

  <!-- Plus sign -->
  <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round">
    <line x1="44" y1="27.5" x2="44" y2="32.5"/>
    <line x1="41.5" y1="30" x2="46.5" y2="30"/>
  </g>

  <!-- Minus -->
  <line x1="41.5" y1="40"
        x2="46.5" y2="40"
        stroke="#FFFFFF"
        stroke-width="1.7"
        stroke-linecap="round"/>

  <!-- Equals -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round">
    <line x1="41.5" y1="49" x2="46.5" y2="49"/>
    <line x1="41.5" y1="51.5" x2="46.5" y2="51.5"/>
  </g>

  <!-- Sparkle -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M53 9l1.2 2.8L57 13l-2.8 1.2L53 17l-1.2-2.8L49 13l2.8-1.2z"/>
  </g>

</svg>
